[project]
name = "mh-curve"
version = "1.0.0"
description = "Modified Kim-Anderson model: M-H loops and harmonic ac susceptibilities (port of CHI999 N88-BASIC)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Masami Mashino" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.7",
]

[project.scripts]
mh-curve = "mhcurve.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mhcurve"

[tool.pyright]
venvPath = "."
venv = ".venv"
