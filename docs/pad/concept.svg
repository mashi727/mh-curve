<svg width="779.0" height="748.8" viewBox="0 0 779.0 748.8" xmlns="http://www.w3.org/2000/svg">
    <title>
        臨界状態モデルの磁化を、@確かめられる形で描く
	:comment 課題：計算の原典は N88-BASIC にしか無い
	:comment 方針：原典を移植し、@独立な解法で突き合わせる
	条件を決める
		:if 論文の図を再現するか
			プリセットから@図と条件を選ぶ
		:else
			k, B₀, ΔH, Hc1 と@Hac, Hdc, a を入れる
	磁化を計算する
		:switch どの解法で解くか
		:case 解析解
			HA の大きさで場合分けし@段ごとの閉じた式で求める
		:case 数値解
			表面は幅 ΔH のプレイ作用素、@内部は Kim 則の包絡で更新する
		:comment 両者の一致を自動テストで確かめる
	:switch 何を見るか
	:case M–H
		初期磁化曲線と@1 周期のループを描く
	:case χn(t)
		t を掃いてループを求め、@高調波の係数を取り出す
	:while 比べたい曲線が残っているか
		計算結果を保存し@表示リストに加える
		色・凡例・パネルを決める
	表示リストを保存して@図を再現できるようにする
	余白を詰めた PDF に書き出す
	:terminal LuaTeX に原寸で取り込む
    </title>
