name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write # attach the zip to a release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      - name: Build (PyInstaller, onedir)
        run: >
          uv run --with pyinstaller pyinstaller packaging/launcher.py
          --name mh-curve
          --windowed
          --noconfirm
          --clean
          --paths src
          --collect-submodules pyqtgraph
          --collect-data pyqtgraph
          --exclude-module tkinter
          --exclude-module PyQt5
          --exclude-module PyQt6

      - name: Smoke test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process dist/mh-curve/mh-curve.exe -ArgumentList "$env:RUNNER_TEMP\mhdata" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "mh-curve.exe exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/mh-curve/* -DestinationPath mh-curve-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: mh-curve-windows-x64
          path: mh-curve-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mh-curve-windows-x64.zip
